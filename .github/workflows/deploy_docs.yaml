name: Build and Deploy Documentation

on:
  push:
    branches:
      - main
    tags:
      - 'v*' 
    paths:
      - 'docs/**'
      - 'sketchkit/**'
      - '.github/workflows/deploy_docs.yaml'
      - 'pyproject.toml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'sketchkit/**'
      - '.github/workflows/deploy_docs.yaml'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  build-docs:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Install UV
        run: |
          if ! command -v uv &> /dev/null; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
          else
            echo "uv is already installed"
          fi
          
      - name: Install dependencies
        run: |
          uv sync --group doc
          
      - name: Clean previous builds
        run: |
          rm -rf docs/build/
          
      - name: Set SKETCHKIT_DOCS_VERSION
        run: |
          if [[ -z "${GITHUB_REF}" ]]; then
            echo "GITHUB_REF is empty. Defaulting to 'main'."
            VERSION="main"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF##*/}"
          else
            VERSION="main"
          fi
          echo "Detected version: $VERSION"
          echo "SKETCHKIT_DOCS_VERSION=$VERSION" >> $GITHUB_ENV
          echo "DOCS_SUBDIR=$VERSION" >> $GITHUB_ENV
          
      - name: Build documentation
        run: |
          cd docs
          uv run make clean && uv run make html
          
      - name: Check documentation build
        run: |
          if [ ! -f "docs/build/html/index.html" ]; then
            echo "Documentation build failed - index.html not found"
            exit 1
          fi
          echo "Documentation built successfully"
          
      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: documentation-${{ github.sha }}
          path: docs/build/html/
          retention-days: 30
          
  deploy-docs:
    needs: build-docs
    runs-on: self-hosted
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Download documentation artifacts
        uses: actions/download-artifact@v4
        with:
          name: documentation-${{ github.sha }}
          path: ./docs-build
          
      - name: Deploy to versions directory
        env:
          DOCS_DEST_DIR: $HOME/www/projects/sketchkit/docs
        run: |
          if [ "${SKETCHKIT_DOCS_VERSION}" = "main" ]; then
            DEPLOY_DIR="$DOCS_DEST_DIR"
          else
            DEPLOY_DIR="$DOCS_DEST_DIR/versions/${SKETCHKIT_DOCS_VERSION}"
          fi
          mkdir -p "$DEPLOY_DIR"
          cp -r ./docs-build/* "$DEPLOY_DIR/"
          echo "Documentation deployed to $DEPLOY_DIR"

      - name: Update versions/index.txt
        env:
          DOCS_DEST_DIR: $HOME/www/projects/sketchkit/docs
        run: |
          INDEX_FILE="$DOCS_DEST_DIR/versions/index.txt"
          touch "$INDEX_FILE"

          if [ ! -w "$INDEX_FILE" ]; then
            echo "No write permission for $INDEX_FILE. Exiting."
            exit 1
          fi

          if [ "${SKETCHKIT_DOCS_VERSION}" != "main" ] && ! grep -qx "${SKETCHKIT_DOCS_VERSION}" "$INDEX_FILE"; then
            echo "${SKETCHKIT_DOCS_VERSION}" >> "$INDEX_FILE"
          fi

          echo "Updated index.txt:"
          cat "$INDEX_FILE"

      - name: Deploy main/latest
        env:
          DOCS_DEST_DIR: $HOME/www/projects/sketchkit/docs
        run: |
          if [ "${SKETCHKIT_DOCS_VERSION}" = "main" ]; then
            cp -r ./docs-build/* $DOCS_DEST_DIR/
          fi
